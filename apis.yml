aid: vimeo
name: Vimeo
description: Vimeo is a video hosting, creation, and streaming platform for creators,
  businesses, and enterprises that provides ad-free video hosting, live streaming,
  video editing, analytics, and OTT distribution. The Vimeo REST API enables programmatic
  upload, management, embedding, and analytics of videos, albums, channels, groups,
  and users using Bearer token (OAuth 2.0) authentication.
