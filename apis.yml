apis:
- aid: vimeo:webhooks
  name: Vimeo Webhooks
  description: >-
    AsyncAPI 2.6 specification for Vimeo's documented webhook surface, covering the Vimeo OTT customer
    and subscription lifecycle topics (customer.created, customer.product.renewed, customer.tvod.created,
    and related events) delivered via HTTPS POST to a subscriber URL. Vimeo's standard API webhooks (App
    Webhooks) are configured per API app from the developer dashboard. Note: Vimeo's official documentation
    states the standard API does not currently emit a webhook on transcode completion; transcode status
    must be polled.
  humanURL: >-
    https://help.vimeo.com/hc/en-us/articles/12427268063761-Supported-webhook-topics-and-what-they-indicate-on-Vimeo-OTT
  baseURL: https://api.vimeo.com
