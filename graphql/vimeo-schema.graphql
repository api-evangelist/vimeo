# ─── Query ───────────────────────────────────────────────────────────────────

type Query {
  """Get the authenticated user."""
  me: User!

  """Get a user by URI or ID."""
  user(userId: String!): User!

  """Search users."""
  users(filter: String, query: String, page: Int, perPage: Int): UserPage!

  """Get a video by URI or ID."""
  video(videoId: String!): Video!

  """Get all videos for the authenticated user."""
  myVideos(pagination: PaginationInput): VideoPage!

  """Get videos for a specific user."""
  userVideos(userId: String!, pagination: PaginationInput): VideoPage!

  """Get videos that appear in a user's feed."""
  userFeed(userId: String!, pagination: PaginationInput): VideoPage!

  """Get videos a user has liked."""
  userLikes(userId: String!, pagination: PaginationInput): VideoPage!

  """Get videos a user has watched."""
  userWatchHistory(userId: String!, pagination: PaginationInput): VideoPage!

  """Get the user's watch later list."""
  watchLater(userId: String!, pagination: PaginationInput): VideoPage!

  """Get an album by ID."""
  album(userId: String!, albumId: String!): Album!

  """Get all albums for a user."""
  userAlbums(userId: String!, pagination: PaginationInput): AlbumPage!

  """Get videos in an album."""
  albumVideos(userId: String!, albumId: String!, pagination: PaginationInput): VideoPage!

  """Get a channel by ID."""
  channel(channelId: String!): Channel!

  """Get all channels."""
  channels(pagination: PaginationInput): ChannelPage!

  """Get videos in a channel."""
  channelVideos(channelId: String!, pagination: PaginationInput): VideoPage!

  """Get a group by ID."""
  group(groupId: String!): Group!

  """Get all groups."""
  groups(pagination: PaginationInput): GroupPage!

  """Get videos in a group."""
  groupVideos(groupId: String!, pagination: PaginationInput): VideoPage!

  """Get a category by name."""
  category(category: String!): Category!

  """Get all categories."""
  categories(pagination: PaginationInput): CategoryPage!

  """Get videos in a category."""
  categoryVideos(category: String!, pagination: PaginationInput): VideoPage!

  """Get channels in a category."""
  categoryChannels(category: String!, pagination: PaginationInput): ChannelPage!

  """Get comments for a video."""
  videoComments(videoId: String!, pagination: PaginationInput): CommentPage!

  """Get text tracks for a video."""
  videoTextTracks(videoId: String!): TextTrackPage!

  """Get chapters for a video."""
  videoChapters(videoId: String!): [Chapter!]!

  """Get thumbnails for a video."""
  videoThumbnails(videoId: String!): [PictureSet!]!

  """Get allowed embed domains for a video."""
  videoAllowedDomains(videoId: String!): [Domain!]!

  """Get a project by ID."""
  project(userId: String!, projectId: String!): Project!

  """Get all projects for a user."""
  userProjects(userId: String!, pagination: PaginationInput): ProjectPage!

  """Get videos in a project."""
  projectVideos(userId: String!, projectId: String!, pagination: PaginationInput): VideoPage!

  """Get a live event."""
  liveEvent(userId: String!, liveEventId: String!): LiveEvent!

  """Get all live events for a user."""
  userLiveEvents(userId: String!, pagination: PaginationInput): LiveEventPage!

  """Get an embed preset."""
  embedPreset(userId: String!, presetId: String!): EmbedPreset!

  """Get all embed presets for a user."""
  userEmbedPresets(userId: String!, pagination: PaginationInput): [EmbedPreset!]!

  """Get a tag by word."""
  tag(word: String!): Tag!

  """Get videos with a specific tag."""
  tagVideos(word: String!, pagination: PaginationInput): VideoPage!

  """Get analytics for a video."""
  videoAnalytics(videoId: String!, dimension: AnalyticsDimension, from: DateTime, to: DateTime): VideoAnalyticsSummary!

  """Get a portfolio."""
  portfolio(userId: String!, portfolioId: String!): Portfolio!

  """Get all portfolios for a user."""
  userPortfolios(userId: String!, pagination: PaginationInput): [Portfolio!]!

  """Get API application info."""
  apiApp(appId: String!): ApiApp!

  """Get webhooks for an API application."""
  apiAppWebhooks(appId: String!): [ApiAppWebhook!]!

  """Search across Vimeo content."""
  search(query: String!, type: String, pagination: PaginationInput): VideoPage!
}

# ─── Mutation ────────────────────────────────────────────────────────────────

type Mutation {
  """Create a new video upload."""
  createVideo(userId: String!, input: CreateVideoInput!): Video!

  """Update video metadata."""
  updateVideo(videoId: String!, input: UpdateVideoInput!): Video!

  """Delete a video."""
  deleteVideo(videoId: String!): Boolean!

  """Add a video to the watch later list."""
  addToWatchLater(userId: String!, videoId: String!): Boolean!

  """Remove a video from the watch later list."""
  removeFromWatchLater(userId: String!, videoId: String!): Boolean!

  """Like a video."""
  likeVideo(userId: String!, videoId: String!): Boolean!

  """Unlike a video."""
  unlikeVideo(userId: String!, videoId: String!): Boolean!

  """Add a tag to a video."""
  addVideoTag(videoId: String!, word: String!): Tag!

  """Remove a tag from a video."""
  removeVideoTag(videoId: String!, word: String!): Boolean!

  """Add a video thumbnail."""
  addVideoThumbnail(videoId: String!, active: Boolean): PictureSet!

  """Delete a video thumbnail."""
  deleteVideoThumbnail(videoId: String!, pictureId: String!): Boolean!

  """Add a domain to video whitelist."""
  addAllowedDomain(videoId: String!, domain: String!): Domain!

  """Remove a domain from video whitelist."""
  removeAllowedDomain(videoId: String!, domain: String!): Boolean!

  """Add a comment to a video."""
  addComment(videoId: String!, input: CreateCommentInput!): Comment!

  """Edit a comment."""
  updateComment(videoId: String!, commentId: String!, text: String!): Comment!

  """Delete a comment."""
  deleteComment(videoId: String!, commentId: String!): Boolean!

  """Add a text track to a video."""
  addTextTrack(videoId: String!, input: CreateTextTrackInput!): TextTrack!

  """Delete a text track."""
  deleteTextTrack(videoId: String!, texttrackId: String!): Boolean!

  """Add a chapter to a video."""
  addChapter(videoId: String!, title: String!, timecode: Float!): Chapter!

  """Delete a chapter from a video."""
  deleteChapter(videoId: String!, chapterId: String!): Boolean!

  """Create an album."""
  createAlbum(userId: String!, input: CreateAlbumInput!): Album!

  """Update an album."""
  updateAlbum(userId: String!, albumId: String!, input: CreateAlbumInput!): Album!

  """Delete an album."""
  deleteAlbum(userId: String!, albumId: String!): Boolean!

  """Add a video to an album."""
  addVideoToAlbum(userId: String!, albumId: String!, videoId: String!): Boolean!

  """Remove a video from an album."""
  removeVideoFromAlbum(userId: String!, albumId: String!, videoId: String!): Boolean!

  """Create a channel."""
  createChannel(input: CreateChannelInput!): Channel!

  """Update a channel."""
  updateChannel(channelId: String!, input: CreateChannelInput!): Channel!

  """Delete a channel."""
  deleteChannel(channelId: String!): Boolean!

  """Follow a channel."""
  followChannel(userId: String!, channelId: String!): Boolean!

  """Unfollow a channel."""
  unfollowChannel(userId: String!, channelId: String!): Boolean!

  """Add a video to a channel."""
  addVideoToChannel(channelId: String!, videoId: String!): Boolean!

  """Remove a video from a channel."""
  removeVideoFromChannel(channelId: String!, videoId: String!): Boolean!

  """Create a group."""
  createGroup(input: CreateGroupInput!): Group!

  """Delete a group."""
  deleteGroup(groupId: String!): Boolean!

  """Join a group."""
  joinGroup(userId: String!, groupId: String!): Boolean!

  """Leave a group."""
  leaveGroup(userId: String!, groupId: String!): Boolean!

  """Add a video to a group."""
  addVideoToGroup(groupId: String!, videoId: String!): Boolean!

  """Remove a video from a group."""
  removeVideoFromGroup(groupId: String!, videoId: String!): Boolean!

  """Create a project."""
  createProject(userId: String!, input: CreateProjectInput!): Project!

  """Update a project."""
  updateProject(userId: String!, projectId: String!, name: String!): Project!

  """Delete a project."""
  deleteProject(userId: String!, projectId: String!, shouldDeleteClips: Boolean): Boolean!

  """Add a video to a project."""
  addVideoToProject(userId: String!, projectId: String!, videoId: String!): Boolean!

  """Remove a video from a project."""
  removeVideoFromProject(userId: String!, projectId: String!, videoId: String!): Boolean!

  """Follow a user."""
  followUser(userId: String!, followUserId: String!): Boolean!

  """Unfollow a user."""
  unfollowUser(userId: String!, followUserId: String!): Boolean!

  """Block a user."""
  blockUser(userId: String!, blockUserId: String!): Boolean!

  """Unblock a user."""
  unblockUser(userId: String!, blockUserId: String!): Boolean!

  """Create a live event."""
  createLiveEvent(userId: String!, input: CreateLiveEventInput!): LiveEvent!

  """Update a live event."""
  updateLiveEvent(userId: String!, liveEventId: String!, input: CreateLiveEventInput!): LiveEvent!

  """Delete a live event."""
  deleteLiveEvent(userId: String!, liveEventId: String!): Boolean!

  """Register a webhook for an API application."""
  createApiAppWebhook(appId: String!, event: String!, targetUrl: URL!): ApiAppWebhook!

  """Delete a webhook."""
  deleteApiAppWebhook(appId: String!, webhookId: String!): Boolean!
}
