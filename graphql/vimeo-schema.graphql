"""
Vimeo GraphQL Schema
Conceptual schema derived from the Vimeo REST API.
Reference: https://developer.vimeo.com/api/reference
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar URL
scalar JSON

# ─── Enums ──────────────────────────────────────────────────────────────────

enum VideoPrivacyView {
  ANYBODY
  NOBODY
  PASSWORD
  DISABLE
  UNLISTED
  USERS
  CONTACTS
  FOLLOWERS
}

enum VideoPrivacyEmbed {
  PUBLIC
  PRIVATE
  WHITELIST
}

enum VideoStatus {
  AVAILABLE
  QUOTA_EXCEEDED
  TOTAL_CAP_EXCEEDED
  TRANSCODE_STARTING
  TRANSCODING
  TRANSCODING_ERROR
  UNAVAILABLE
  UPLOADING
  UPLOADING_ERROR
}

enum VideoLicenseType {
  BY
  BY_NC
  BY_NC_ND
  BY_NC_SA
  BY_ND
  BY_SA
  CC0
}

enum VideoContentRating {
  LANGUAGE
  DRUGS
  VIOLENCE
  NUDITY
  SAFE
  UNRATED
}

enum VideoReviewStatus {
  APPROVED
  PENDING
  REJECTED
}

enum ChannelPrivacy {
  ANYBODY
  MODERATORS
  USERS
}

enum GroupPrivacy {
  ANYBODY
  MEMBERS
}

enum CommentType {
  VIDEO
  ALBUM
}

enum LiveEventStatus {
  ENDED
  STARTED
  STREAMING
  CREATED
}

enum UploadApproach {
  POST
  PULL
  TTML
  URL
}

enum TranscodeStatus {
  COMPLETE
  ERROR
  IN_PROGRESS
}

enum OTTProductType {
  TVOD
  SVOD
}

enum CaptionType {
  SUBTITLES
  CAPTIONS
}

enum AnalyticsDimension {
  VIDEO
  COUNTRY
  DEVICE_TYPE
  EMBED_DOMAIN
  STREAM_TYPE
  VIDEO_LICENSE
}

enum SortDirection {
  ASC
  DESC
}

enum EmbedPresetPosition {
  ABOVE_THE_PLAYER
  BELOW_THE_PLAYER
}

# ─── Core Types ─────────────────────────────────────────────────────────────

"""A Vimeo user account."""
type User {
  uri: String!
  name: String!
  link: URL!
  capabilities: UserCapabilities!
  bio: String
  shortBio: String
  location: String
  gender: String
  createdTime: DateTime!
  account: String!
  pictures: PictureSet
  websites: [UserWebsite!]!
  metadata: UserMetadata!
  uploadQuota: UploadQuota!
  preferences: UserPreferences
  contentFilter: [VideoContentRating!]
  resourceKey: String!
}

"""Quota information for a user's upload allowance."""
type UploadQuota {
  space: QuotaSpace!
  periodic: QuotaPeriodic
  lifetime: QuotaLifetime
}

type QuotaSpace {
  free: Float!
  max: Float
  used: Float!
  showing: String!
}

type QuotaPeriodic {
  free: Int!
  max: Int
  used: Int!
  resetDate: DateTime
  unit: String!
}

type QuotaLifetime {
  free: Int!
  max: Int
  used: Int!
  unit: String!
}

"""Metadata connections for a user."""
type UserMetadata {
  connections: UserConnections!
  interactions: UserInteractions!
}

type UserConnections {
  albums: Connection!
  appearances: Connection!
  categories: Connection!
  channels: Connection!
  feed: Connection!
  followers: Connection!
  following: Connection!
  groups: Connection!
  likes: Connection!
  membershipConnections: Connection!
  moderated_channels: Connection!
  portfolios: Connection!
  projects: Connection!
  recommendedChannels: Connection!
  recommendedUsers: Connection!
  shared: Connection!
  videos: Connection!
  watchedVideos: Connection!
  watchlater: Connection!
}

type UserInteractions {
  addPrivacyUser: Interaction
  block: Interaction
  follow: Interaction
  report: Interaction
}

type UserCapabilities {
  hasLiveStreaming: Boolean!
  hasUnlimitedStorage: Boolean!
  hasSeoControls: Boolean!
  hasTeamFeatures: Boolean!
  hasAdvancedAnalytics: Boolean!
  hasPrivacyModes: Boolean!
}

type UserPreferences {
  videos: UserPreferencesVideos
}

type UserPreferencesVideos {
  privacy: UserPreferencesVideoPrivacy
}

type UserPreferencesVideoPrivacy {
  view: VideoPrivacyView
  comments: String
  embed: VideoPrivacyEmbed
  download: Boolean
  add: Boolean
}

type UserWebsite {
  uri: String
  name: String
  link: URL!
  type: String
  description: String
}

